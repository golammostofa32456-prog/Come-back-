name: come_back
description: A professional TikTok-style video-sharing app built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture Packages
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  fpdart: ^1.1.0
  
  # Backend & Services
  supabase_flutter: ^2.5.0
  
  # UI & Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
